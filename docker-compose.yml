# ════════════════════════════════════════════════════════════════
# Credit Scoring System — Docker Compose
# ════════════════════════════════════════════════════════════════
# Run:  docker-compose up --build
# Stop: docker-compose down
# ════════════════════════════════════════════════════════════════

version: "3.9"

services:
  # ── FastAPI Backend ─────────────────────────────────────────
  api:
    build: .
    container_name: credit-scoring-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/api/v1/health'); assert r.status_code == 200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Streamlit Dashboard ─────────────────────────────────────
  dashboard:
    build: .
    container_name: credit-scoring-dashboard
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
